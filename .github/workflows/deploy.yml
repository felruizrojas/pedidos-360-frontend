name: Deploy frontend a EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (SSR)
        run: npx ng build

      - name: Copiar build (browser + server) a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/pedidos-360-frontend/**'
          target: '/opt/pedidos360/frontend'
          strip_components: 2

      - name: Copiar package.json/lock a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'package.json,package-lock.json'
          target: '/opt/pedidos360/frontend'

      - name: Instalar dependencias de produccion y reiniciar servicio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/pedidos360/frontend
            npm ci --omit=dev
            sudo systemctl restart pedidos360-frontend
            sleep 5
            sudo systemctl status pedidos360-frontend --no-pager
