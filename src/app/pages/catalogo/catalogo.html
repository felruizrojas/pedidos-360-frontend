<main class="min-h-[calc(100vh-4rem)] bg-linear-to-br from-indigo-50 via-white to-purple-50 px-4 py-10">
  <div class="max-w-6xl mx-auto space-y-8">

    <div class="text-center space-y-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900">
        Nuestro
        <span class="text-transparent bg-clip-text bg-linear-to-r from-indigo-600 to-purple-600">
          Catálogo
        </span>
      </h1>
      <p class="text-gray-500">Productos disponibles en Pedidos 360.</p>
    </div>

    @if (productos().length === 0) {
      <p class="text-center text-gray-400">Cargando productos…</p>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (item of productos(); track item.id) {
          <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 space-y-3 transition-all duration-300 hover:shadow-2xl">
            <div class="flex items-start justify-between gap-2">
              <h2 class="text-lg font-bold text-gray-900">{{ item.nombre }}</h2>
              <span class="shrink-0 text-xs font-medium text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                {{ item.categoria }}
              </span>
            </div>

            <p class="text-sm text-gray-500">{{ item.descripcion }}</p>

            <div class="flex items-center justify-between pt-2 border-t border-gray-100">
              <span class="text-xl font-extrabold text-gray-900">
                ${{ item.precio | number:'1.0-0' }}
              </span>
              <span class="text-xs font-medium text-gray-400">
                Stock: {{ item.stock }}
              </span>
            </div>
          </div>
        }
      </div>
    }

  </div>
</main>
