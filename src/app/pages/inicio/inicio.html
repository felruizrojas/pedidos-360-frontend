<!-- Contenido Principal (Sección de Bienvenida): mismo alto que tenía antes
     (viewport completo menos el navbar), el footer queda debajo al hacer scroll. -->
<main class="relative min-h-[calc(100vh-4rem)] flex items-center justify-center overflow-hidden px-4">
  <!-- Video de fondo, decorativo: autoplay silencioso, sin controles ni foco.
       [muted] como propiedad (no atributo): Angular crea el <video> por JS y el atributo
       "muted" no silencia en ese caso, así que el navegador bloqueaba el autoplay. -->
  <video #heroVideo class="absolute inset-0 w-full h-full object-cover" src="/video_repartidor.mp4" autoplay
    [muted]="true" loop playsinline aria-hidden="true" tabindex="-1"></video>

  <!-- Velo claro sobre el video para que el texto siga siendo legible -->
  <div class="absolute inset-0 bg-linear-to-br from-indigo-50/50 via-white/40 to-purple-50/50" aria-hidden="true"></div>

  <div class="relative text-center max-w-2xl mx-auto space-y-6">
    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-gray-900">
      Bienvenid@s a
      <span class="block text-transparent bg-clip-text bg-linear-to-r from-indigo-600 to-purple-600 mt-2">
        Pedidos 360
      </span>
    </h1>
    <p class="text-lg sm:text-xl text-gray-500 font-light max-w-md mx-auto">
      Gestiona, controla y lleva el seguimiento de tus pedidos en un solo lugar.
    </p>
  </div>
</main>
